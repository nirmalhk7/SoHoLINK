# Run locally: golangci-lint run ./...
# Whole-program reachability: deadcode ./... uses production entry points.
# deadcode -test ./... also treats test entry points as roots.
# See DEVELOPMENT.md for when to use each check.
version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - unused
  settings:
    staticcheck:
      checks: ["all"]
  exclusions:
    rules:
      # Preserve the existing exception for generated mock methods.
      - path: "_mock\\.go$"
        linters: [unused]

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
